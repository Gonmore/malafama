server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Simple container health endpoint
  location = /health {
    default_type application/json;
    return 200 '{"status":"OK","service":"MalaFama Frontend"}';
  }
}
