services:
  backend:
    image: ${DOCKER_USER:-gonmore14}/backend-malafama:${APP_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: backend-malafama
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000

      # DB (existing container)
      DB_HOST: ${DB_HOST:-postgres-principal}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-malafama}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}

      # Auth
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}

      # API/CORS
      API_VERSION: ${API_VERSION:-v1}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://comandas.malafamacomedia.com}

      # Optional logging/limits
      LOG_SQL: ${LOG_SQL:-false}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-5000}

      # Startup behavior
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      DB_WAIT_RETRIES: ${DB_WAIT_RETRIES:-60}
      DB_WAIT_SECONDS: ${DB_WAIT_SECONDS:-2}

      # Platform admin bootstrap (runs inside backend container; idempotent)
      RUN_PLATFORM_ADMIN_SEED: ${RUN_PLATFORM_ADMIN_SEED:-true}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-admin@supernovatel.com}
      PLATFORM_ADMIN_NAME: ${PLATFORM_ADMIN_NAME:-Platform Admin}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD}
      PLATFORM_ADMIN_ALLOW_PROMOTE: ${PLATFORM_ADMIN_ALLOW_PROMOTE:-false}

      # Tenant referencia defaults
      REFERENCIA_TENANT_NOMBRE: ${REFERENCIA_TENANT_NOMBRE:-Tenant Admin (Referencia)}
      REFERENCIA_TENANT_PLAN_DEFAULT: ${REFERENCIA_TENANT_PLAN_DEFAULT:-gratuito}
      REFERENCIA_TENANT_MONEDA_DEFAULT: ${REFERENCIA_TENANT_MONEDA_DEFAULT:-Bs}
      REFERENCIA_TENANT_MAX_LOCALES: ${REFERENCIA_TENANT_MAX_LOCALES:-999999}
      REFERENCIA_TENANT_SUSCRIPCION_DIAS: ${REFERENCIA_TENANT_SUSCRIPCION_DIAS:-36500}

    ports:
      - "127.0.0.1:6010:5000"
    volumes:
      - malafama_uploads:/app/uploads
    networks:
      - red-interna

  frontend:
    image: ${DOCKER_USER:-gonmore14}/frontend-malafama:${APP_VERSION:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: frontend-malafama
    restart: unless-stopped
    ports:
      - "127.0.0.1:6011:80"
    networks:
      - red-interna

volumes:
  malafama_uploads:

networks:
  red-interna:
    external: true
    name: red-interna
